[package]
name = "alejandradb"
version = "1.0.3"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "TUI/CLI to manage Android devices via ADB"
readme = "README.md"
repository = "https://github.com/AlejandraDB-MF/AlejandraDB-CLI"
keywords = ["cli", "tui", "android", "adb", "device-management"]
categories = ["command-line-utilities"]
authors = ["AlejandraDB-MF"]

[[bin]]
name = "alejandradb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.30"
regex = "1.11"
rust-i18n = "4.2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "0.8"

[dev-dependencies]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/alejandradb-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"
debug = false
overflow-checks = false

[lints.rust]
unsafe_code = "forbid"

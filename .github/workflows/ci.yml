name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo nextest run --locked

      - name: Doc tests
        run: cargo test --doc --locked

      - name: Build (release)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: cargo build --release --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64 musl cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cd /tmp
          curl -fsSL --retry 3 -o tc.tar.xz \
            https://github.com/cross-tools/musl-cross/releases/download/20260823/aarch64-unknown-linux-musl.tar.xz
          tar xJf tc.tar.xz
          echo "/tmp/aarch64-unknown-linux-musl/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-musl)
              export CC_aarch64_unknown_linux_musl=aarch64-unknown-linux-musl-gcc
              export AR_aarch64_unknown_linux_musl=aarch64-unknown-linux-musl-ar
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-unknown-linux-musl-gcc
              ;;
          esac
          cargo build --release --target ${{ matrix.target }} --locked

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/alejandradb.exe" "dist/alejandradb-${{ matrix.target }}.exe"
              powershell -NoProfile -Command \
                "Compress-Archive -Path 'target/${{ matrix.target }}/release/alejandradb.exe' -DestinationPath 'dist/alejandradb-${{ matrix.target }}.zip' -Force"
              tar czf "dist/alejandradb-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" alejandradb.exe
              ;;
            *)
              tar czf "dist/alejandradb-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" alejandradb
              ;;
          esac
          ( cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alejandradb-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: alejandradb-*
          merge-multiple: true
          path: dist

      - name: Verify artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la dist/
          test "$(ls dist/ | wc -l)" -gt 0

      - name: Upload release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        with:
          files: dist/*
          body: |
            ## Installation

            ### Linux (x86_64/aarch64, static musl)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/AlejandraDB-MF/AlejandraDB-CLI/main/install.sh | sh
            ```

            ### Windows
            Download `alejandradb.exe` (or the `.zip`) and place it in your PATH.

            ### Manual
            Pick the `.tar.gz` matching your target from the assets below and verify it against the adjacent `.sha256`.
